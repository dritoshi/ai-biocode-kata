# =============================================================================
# コードサンプルのテストを CI で自動実行するワークフロー。
# push および pull_request のたびに、uv で固定した依存環境を再現して ruff と pytest を走らせる。
# 本書 §7 の最小例（pip ベース）に対し、ここではリポジトリ実体に合わせて uv を用いる。
# ruff format / mypy ゲートは未導入（TODO.md の Phase 2-c 参照。掲載コードとの同期検討が必要なため）。
# =============================================================================

name: テスト実行

on:
  push:
  pull_request:
  workflow_dispatch:  # Actions タブから手動でも実行できるようにする

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # uv 本体をインストールし、依存解決を高速化するためキャッシュを有効化する
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      # pyproject.toml の requires-python を満たす Python を用意する
      - name: Set up Python
        run: uv python install 3.12

      # uv.lock に固定されたバージョンどおりに依存を同期する（再現性）
      - name: Sync dependencies
        run: uv sync

      # コード品質チェック（リント）
      - name: Lint
        run: uv run ruff check scripts/ tests/

      # サンプルコードのテストを実行する
      - name: Run tests
        run: uv run pytest
